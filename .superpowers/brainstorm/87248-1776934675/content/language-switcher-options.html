<h2>語系切換器設計提案</h2>
<p class="subtitle">選擇您偏好的使用者體驗與整合位置</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>AJAX 原地切換 (推薦)</h3>
      <p>點擊後透過 Inertia POST 到後端設定 Cookie，並自動觸發 shared props 更新，體驗最流暢。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>頁面重新整理</h3>
      <p>設定 Cookie 後強制 window.location.reload()，雖然有閃爍但能確保所有環境變數與 i18n 實例完全同步。</p>
    </div>
  </div>
</div>
